<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fon Google dipindah dari @import dalam index.css KE SINI (2026-08-19, pepijat "kad HERO
         mengembang bila refresh" Izzat) — @import CSS cuma DITEMUI selepas pelayar muat turun DAN
         hurai index.css sepenuhnya, jadi permintaan fon fizikal bermula LEWAT. Kad bento yang
         hampir mencecah had baris (tinggi carousel dikunci JS SEBAIK render pertama, lihat nota
         CarouselStableBlock CLAUDE.md) sempat diukur SEBELUM fon sebenar sampai, guna fon fallback
         sistem yang lebar aksaranya berbeza — pengukuran susulan (`document.fonts.ready`) betulkan
         semula selepas fon sampai, kelihatan sebagai kad "mengembang" sekejap. `<link>` di sini
         DITEMUI serta-merta semasa pelayar hurai HTML, selari dengan permintaan lain (bukan
         menunggu index.css) — fon sampai jauh lebih awal, pengukuran pertama jauh lebih kerap
         sudah tepat. preconnect dahulukan sambungan TCP/TLS ke kedua-dua domain Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Libre+Franklin:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Pinyon+Script&family=Alex+Brush&family=Great+Vibes&family=Sacramento&family=Parisienne&family=Allura&family=Herr+Von+Muellerhoff&family=Birthstone:wght@400&family=Birthstone+Bounce:wght@400;500&family=Mrs+Saint+Delafield&family=Caveat:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Playpen+Sans:wght@300;400;500;600;700&family=Playpen+Sans+Arabic:wght@300;400;500;600;700&display=swap" />
    <title>Adjung Brief</title>

    <!-- Meta lalai seluruh laman (Fasa 9, SEO & penemuan). Kandungan per-artikel mengemas kini
         tajuk/meta/OG/JSON-LD ni secara dinamik (client-side, lihat FocusView.tsx) bila Focus View
         dibuka — bantu pratonton perkongsian sosial yang jalankan JS, tapi TIDAK membantu crawler
         yang tidak jalankan JS sebab laman ini SPA tanpa SSR (lihat PELAN_PRA_LAUNCH.md Fasa 9). -->
    <meta name="description" content="Adjung Brief ialah portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah, memaparkan kandungan editorial pelbagai bidang (berita, ilmu, kebudayaan) yang disunting oleh pasukan editorial Adjung." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adjung Brief" />
    <meta property="og:title" content="Adjung Brief" />
    <meta property="og:description" content="Portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah. Berita, ilmu dan kebudayaan disunting oleh pasukan editorial Adjung." />
    <!-- URL/imej MUTLAK, bukan laluan relatif (2026-08-16, audit Launch Gate) — ramai crawler
         perkongsian sosial (Facebook/WhatsApp khususnya) tak selesaikan og:image/og:url relatif
         terhadap URL laman dgn boleh dipercayai; had spesifikasi cadangkan URL mutlak sentiasa.
         2026-08-23: aset PNG 1200x630 khas kongsi-sosial (public/og-image.png) kini wujud,
         gantikan adjung-symbol.svg lama (Facebook/Twitter TIDAK sokong SVG untuk og:image/
         twitter:image — nota asal di sini, kekal sebagai rekod sejarah kenapa SVG dipakai dulu). -->
    <meta property="og:image" content="https://brief.adjung.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://brief.adjung.com/" />
    <meta property="og:locale" content="ms_MY" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adjung Brief" />
    <meta name="twitter:description" content="Portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah. Berita, ilmu dan kebudayaan disunting oleh pasukan editorial Adjung." />
    <meta name="twitter:image" content="https://brief.adjung.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
