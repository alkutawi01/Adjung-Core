<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Adjung Brief</title>

    <!-- Meta lalai seluruh laman (Fasa 9, SEO & penemuan). Kandungan per-artikel mengemas kini
         tajuk/meta/OG/JSON-LD ni secara dinamik (client-side, lihat FocusView.tsx) bila Focus View
         dibuka — bantu pratonton perkongsian sosial yang jalankan JS, tapi TIDAK membantu crawler
         yang tidak jalankan JS sebab laman ini SPA tanpa SSR (lihat PELAN_PRA_LAUNCH.md Fasa 9). -->
    <meta name="description" content="Adjung Brief — portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah, memaparkan kandungan editorial pelbagai bidang (berita, ilmu, kebudayaan) yang disunting oleh pasukan editorial Adjung." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adjung Brief" />
    <meta property="og:title" content="Adjung Brief" />
    <meta property="og:description" content="Portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah — berita, ilmu dan kebudayaan disunting oleh pasukan editorial Adjung." />
    <!-- URL/imej MUTLAK, bukan laluan relatif (2026-08-16, audit Launch Gate) — ramai crawler
         perkongsian sosial (Facebook/WhatsApp khususnya) tak selesaikan og:image/og:url relatif
         terhadap URL laman dgn boleh dipercayai; had spesifikasi cadangkan URL mutlak sentiasa.
         SVG dikekalkan sebagai imej lalai (bukan pepijat baharu) — laman ni belum ada aset PNG/JPG
         khas kongsi-sosial (1200x630), Facebook/Twitter kedua-duanya TIDAK sokong SVG untuk
         og:image/twitter:image, jadi pratonton kongsi mungkin tiada imej pada platform tu sehingga
         aset PNG sebenar disediakan — bukan boleh dibetulkan drpd baris kod sahaja, perlukan reka
         bentuk aset baharu. -->
    <meta property="og:image" content="https://brief.adjung.com/adjung-symbol.svg" />
    <meta property="og:url" content="https://brief.adjung.com/" />
    <meta property="og:locale" content="ms_MY" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Adjung Brief" />
    <meta name="twitter:description" content="Portal berita dan ilmu bahasa Melayu bergaya majalah ilmiah — berita, ilmu dan kebudayaan disunting oleh pasukan editorial Adjung." />
    <meta name="twitter:image" content="https://brief.adjung.com/adjung-symbol.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
