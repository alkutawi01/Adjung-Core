name: Deploy ke pengeluaran

# Auto-deploy ke Droplet adjung-brief-prod setiap kali push ke main (2026-09-01, Izzat —
# lepas berulang kali kena tekan arahan deploy manual sendiri sebab SSH Claude Code disekat
# classifier keselamatan platform sendiri, bukan isu kunci/kebenaran). Rujuk DEPLOY.md untuk
# langkah manual (kekal sebagai fallback/rujukan sejarah, bukan lagi laluan utama rutin).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Kunci SSH disimpan sebagai SATU baris base64 (2026-09-03) — bukan tampal PEM
      # berbilang-baris terus ke dalam secret DEPLOY_SSH_KEY. Sebab: percubaan berulang tampal
      # kunci PEM asal terus (7 baris, BEGIN/END OPENSSH PRIVATE KEY) sentiasa gagal
      # "ssh.ParsePrivateKey: ssh: no key found" walau fail asal di pelayan disahkan betul (wc -l
      # = 7) — root cause sebenar tak dapat disahkan (kotak teks GitHub/salin-tampal console
      # pelayar mengubah baris baharu/aksara entah bagaimana), tapi base64 SATU BARIS langsung
      # tak boleh rosak macam ni (tiada baris baharu/ruang untuk hilang). Nyahkod ke fail
      # DALAM ${{ github.workspace }} (BUKAN /tmp) — ssh-action jalan dalam kontena Docker
      # berasingan yang cuma mount ${{ github.workspace }} (jadi /github/workspace di dalam
      # kontena), /tmp runner TAK kelihatan langsung dalam kontena tu ("no such file or
      # directory" 2026-09-03 selepas cuba /tmp/deploy_key).
      # chmod 644 (bukan 600) — ssh-action jalankan proses SSH sebagai UID BERBEZA di dalam
      # kontena Docker berbanding UID yang cipta fail ni di runner (2026-09-03, "permission
      # denied" selepas 600 disahkan gagal). Kunci ni sekali-pakai, wujud sekejap sahaja dalam
      # runner ephemeral yang dimusnahkan lepas job tamat — risiko keselamatan longgarkan baca
      # boleh diabaikan berbanding kegagalan deploy berterusan.
      - name: Nyahkod kunci SSH
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > "${{ github.workspace }}/deploy_key"
          chmod 644 "${{ github.workspace }}/deploy_key"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /github/workspace/deploy_key
          script: |
            set -e
            cd /var/www/adjung-brief
            # Checkpoint WAL dulu sebelum `cp` — pepijat SAMA PERSIS yang dibaiki pada backup
            # berjadual harian & backup pra-migrasi boot-time (server.js): `cp` mentah terhadap
            # `adjung.db` semasa pelayan LIVE masih berjalan (pm2 belum restart lagi ketika baris
            # ni jalan) boleh tercicir baris terkini yang masih duduk dalam `-wal`, jadikan backup
            # "jaring keselamatan sebelum deploy" senyap tak lengkap. Guna node_modules/sqlite3
            # sedia ada (dari deploy SEBELUM ni — baris ni jalan SEBELUM `npm install`) supaya
            # tak bergantung pada CLI `sqlite3` yang mungkin tak dipasang di droplet. Checkpoint
            # gagal TIDAK boleh menghalang deploy (falsafah sama macam backup berjadual/boot).
            node -e "
              const sqlite3 = require('./node_modules/sqlite3').verbose();
              const db = new sqlite3.Database('adjung.db');
              db.run('PRAGMA wal_checkpoint(TRUNCATE);', (err) => {
                if (err) console.warn('[Backup Pra-Deploy] wal_checkpoint gagal:', err.message);
                db.close(() => process.exit(0));
              });
            " || echo "[Backup Pra-Deploy] langkau checkpoint (node_modules/sqlite3 belum wujud?)"
            cp adjung.db "adjung.db.backup-$(date +%Y%m%d-%H%M%S)-auto-deploy"
            git pull
            npm install
            npm run build
            pm2 restart adjung-brief
